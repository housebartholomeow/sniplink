<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sniplink — Free URL Shortener</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "DM Sans", sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
  a { text-decoration: none; color: inherit; }

  .nav { background: #fff; border-bottom: 0.5px solid #e0e0e0; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .nav-logo { font-weight: 600; font-size: 17px; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
  .nav-logo-icon { width: 30px; height: 30px; background: #e6f1fb; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #185fa5; font-size: 16px; }
  /* nav-links container removed entirely - no "Analytics" text on top right */
  .btn-primary { background: #185fa5; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-primary:hover { background: #0c447c; }
  .btn-outline { background: transparent; color: #185fa5; border: 1px solid #185fa5; padding: 7px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; }
  .btn-outline:hover { background: #e6f1fb; }

  .hero { background: #fff; border-bottom: 0.5px solid #e0e0e0; padding: 3rem 2rem 2.5rem; text-align: center; }
  .hero h1 { font-size: 28px; font-weight: 600; color: #1a1a1a; margin-bottom: 0.5rem; }
  .hero p { font-size: 15px; color: #666; margin-bottom: 2rem; }
  .input-row { display: flex; gap: 8px; max-width: 640px; margin: 0 auto; }
  .url-input { flex: 1; height: 44px; padding: 0 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #fafafa; color: #1a1a1a; outline: none; font-family: inherit; }
  .url-input:focus { border-color: #185fa5; box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
  .shorten-btn { height: 44px; padding: 0 20px; background: #185fa5; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-family: inherit; }
  .shorten-btn:hover { background: #0c447c; }
  .options-row { display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin-top: 1rem; font-size: 13px; color: #666; flex-wrap: wrap; }
  .options-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .alias-input { height: 28px; padding: 0 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: #fafafa; color: #1a1a1a; width: 120px; outline: none; font-family: inherit; }

  .result-wrap { max-width: 640px; margin: 1.5rem auto 0; padding: 0 1.5rem; display: none; }
  .result-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1rem 1.25rem; }
  .result-header { font-size: 12px; color: #888; margin-bottom: 8px; }
  .result-row { display: flex; align-items: center; gap: 8px; }
  .short-url { font-size: 16px; font-weight: 500; color: #185fa5; flex: 1; }
  .action-btn { height: 32px; padding: 0 12px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; color: #333; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; transition: all 0.2s; }
  .action-btn:hover { border-color: #aaa; }
  .original-url { font-size: 12px; color: #888; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .section { max-width: 760px; margin: 2.5rem auto 0; padding: 0 1.5rem; }
  .section-label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1rem; }
  /* stats-grid and related stat-card styles removed — no "Your stats this month" section */

  .history-table { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden; margin-bottom: 3rem; }
  .history-header { display: grid; grid-template-columns: 2fr 1.2fr 100px 50px; gap: 12px; padding: 10px 16px; background: #f5f5f3; border-bottom: 1px solid #e0e0e0; font-size: 12px; font-weight: 500; color: #888; }
  .history-row { display: grid; grid-template-columns: 2fr 1.2fr 100px 50px; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #eee; align-items: center; font-size: 13px; }
  .history-row:last-child { border-bottom: none; }
  .history-row:hover { background: #fafafa; }
  .orig { color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .short { color: #185fa5; font-weight: 500; }
  .row-actions { display: flex; gap: 8px; }
  .icon-btn { background: none; border: none; cursor: pointer; color: #999; font-size: 16px; padding: 2px; line-height: 1; transition: color 0.2s; }
  .icon-btn:hover { color: #1a1a1a; }

  footer { border-top: 1px solid #e0e0e0; background: #fff; padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .footer-left { font-size: 13px; color: #888; }
  .footer-links { display: flex; gap: 1.5rem; }
  .footer-link { font-size: 13px; color: #888; }
  .footer-link:hover { color: #1a1a1a; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="sniplink.html">
    <div class="nav-logo-icon"><i class="ti ti-link"></i></div>
    Sniplink
  </a>
  <!-- "Analytics" link removed from top right as requested -->
</nav>

<div class="hero">
  <h1>Shorten, share, and track your links</h1>
  <p>Paste a long URL below to create a short, shareable link in seconds.</p>
  <div class="input-row">
    <input class="url-input" type="text" placeholder="Paste your long URL here..." id="urlInput" />
    <button class="shorten-btn" onclick="showResult()">
      <i class="ti ti-scissors"></i> Shorten URL
    </button>
  </div>
</div>

<div class="result-wrap" id="result">
  <div class="result-card">
    <div class="result-header">Your shortened link is ready</div>
    <div class="result-row">
      <span class="short-url" id="generatedShortUrl"></span>
      <button class="action-btn" id="mainCopyBtn"><i class="ti ti-copy"></i> Copy</button>
    </div>
    <div class="original-url" id="orig-url">Original: —</div>
  </div>
</div>

<!-- Entire "Your stats this month" section has been removed - no stats grid, no stat cards, no analytics summary in the middle -->

<div class="section" style="margin-top:2rem;">
  <div class="section-label">Link Analytics</div>
  <div class="history-table" id="history-container">
    </div>
</div>

<footer>
  <div class="footer-left">© 2026 Sniplink — Free URL shortener</div>
</footer>

<script>
  // New function to fetch analytics from the backend
  async function fetchAnalytics() {
    const container = document.getElementById('history-container');
    container.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">Loading analytics...</div>';
    
    try {
      // Assumes you have a GET endpoint at /api/links that returns the array of URLs and their click stats
      const response = await fetch('http://localhost:8080/api/links');
      if (!response.ok) throw new Error('Failed to fetch analytics');
      
      const data = await response.json();
      renderHistoryTable(data);
    } catch (error) {
      console.error(error);
      container.innerHTML = '<div style="padding: 20px; text-align: center; color: #b91c1c;">Error loading link analytics.</div>';
    }
  }

  async function showResult() {
    const urlInput = document.getElementById('urlInput');
    const resultDiv = document.getElementById('result');
    const origUrlEl = document.getElementById('orig-url');
    const shortUrlEl = document.getElementById('generatedShortUrl');
    const shortenBtn = document.querySelector('.shorten-btn');
    
    let inputValue = urlInput.value.trim();
    if (!inputValue) {
      urlInput.style.borderColor = '#b91c1c';
      urlInput.setAttribute('placeholder', 'Please enter a valid URL!');
      return;
    }
    urlInput.style.borderColor = '#ccc';
    
    const originalBtnText = shortenBtn.innerHTML;
    shortenBtn.innerHTML = '<i class="ti ti-loader"></i> Shortening...';
    shortenBtn.disabled = true;
    
    try {
      const response = await fetch('http://localhost:8080/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ originalURL: inputValue })
      });
      
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || 'Failed to shorten URL');
      }
      
      origUrlEl.textContent = 'Original: ' + data.originalURL;
      shortUrlEl.textContent = data.shortUrl;
      resultDiv.style.display = 'block';
      resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      
      urlInput.value = '';
      
      // Refresh the analytics table after creating a new short URL
      await fetchAnalytics();
    } catch (error) {
      alert('Shortening error: ' + error.message);
    } finally {
      shortenBtn.innerHTML = originalBtnText;
      shortenBtn.disabled = false;
    }
  }
  
  // Render history table strictly using data passed from the backend
  function renderHistoryTable(data) {
    const container = document.getElementById('history-container');
    
    let html = `
      <div class="history-header">
        <span>Original URL</span>
        <span>Short link</span>
        <span>Link clicked</span>
        <span>Actions</span>
      </div>
    `;
    
    if (!data || data.length === 0) {
      html += `<div class="history-row" style="grid-template-columns: 1fr; text-align: center; color: #888;">No links found. Create one above!</div>`;
    } else {
      data.forEach((item) => {
        // Fallbacks account for how your eventual API might structure the returned data
        const orig = item.originalURL || item.orig;
        const shortCode = item.shortCode || item.short;
        const shortUrl = item.shortUrl || item.fullShortUrl || `http://localhost:3000/${shortCode}`;
        const displayShort = shortUrl.replace(/^https?:\/\//, '');
        const clicks = item.clicks || 0;

        html += `
          <div class="history-row">
            <span class="orig" title="${escapeHtml(orig)}">${truncateUrl(orig, 50)}</span>
            <span class="short">${displayShort}</span>
            <span>${clicks}</span>
            <div class="row-actions">
              <button class="icon-btn copy-btn" data-url="${escapeAttr(shortUrl)}" title="Copy"><i class="ti ti-copy"></i></button>
            </div>
          </div>
        `;
      });
    }
    container.innerHTML = html;
    attachEventListeners();
  }
  
  // helper to escape HTML
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }
  function escapeAttr(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }
  function truncateUrl(url, maxLen) {
    if (!url) return '';
    if (url.length <= maxLen) return url;
    return url.slice(0, maxLen - 3) + '...';
  }
  
  function attachEventListeners() {
    // Only attaching the copy button listener now
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const url = e.currentTarget.getAttribute('data-url');
        if (url) copyToClipboard(url, e.currentTarget, false);
        else copyToClipboard('', e.currentTarget, false);
      });
    });
  }
  
  // Main copy button for result card
  document.getElementById('mainCopyBtn').addEventListener('click', function() {
    const textToCopy = document.getElementById('generatedShortUrl').textContent;
    if (textToCopy && textToCopy !== '—') {
      copyToClipboard(textToCopy, this, true);
    } else {
      const tempBtn = this;
      const originalHTML = tempBtn.innerHTML;
      tempBtn.innerHTML = '<i class="ti ti-alert"></i> No link';
      setTimeout(() => { tempBtn.innerHTML = originalHTML; }, 1200);
    }
  });
  
  function copyToClipboard(text, buttonElement, isResultCard = false) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const originalHTML = buttonElement.innerHTML;
      if (isResultCard) {
        buttonElement.innerHTML = '<i class="ti ti-check" style="color: #0f6e56;"></i> Copied!';
      } else {
        // For icon buttons, keep simple checkmark
        buttonElement.innerHTML = '<i class="ti ti-check" style="color: #0f6e56;"></i>';
      }
      setTimeout(() => {
        buttonElement.innerHTML = originalHTML;
      }, 2000);
    }).catch(() => {
      // fallback
      alert('Press Ctrl+C to copy: ' + text);
    });
  }
  
  // On load fetch analytics data
  document.addEventListener('DOMContentLoaded', () => {
    fetchAnalytics();
  });
</script>
</body>
</html>
