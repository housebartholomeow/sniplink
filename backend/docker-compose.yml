version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configure listeners so both Docker and localhost can communicate
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    build: .
    depends_on:
      - kafka
      - pgbouncer
      - redis
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:29092
      - PORT=3000
      - BASE_URL=${BASE_URL}
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80" # The main entry point for the load balancer
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
      
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      # PgBouncer looks at this URL to know where the actual database is
      - DATABASE_URL=${PGBOUNCER_URL}
      - POOL_MODE=transaction
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "6432:5432"
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"