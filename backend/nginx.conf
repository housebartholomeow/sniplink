events {
    worker_connections 1024;
}

http {
    upstream sniplink_api {
        least_conn; # Enforces the Least Connections algorithm
        server backend:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://sniplink_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}